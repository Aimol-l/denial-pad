# Installed to ~/.config/systemd/user/droidloom.service.d/ by
# tools/denial-deploy-bundle.
#
# droidloom starts beside the compositor and exits when the compositor's
# Wayland socket is not there yet. Its unit allows five restarts one second
# apart, so a boot where deniald came up a moment later burned through them in
# five seconds, hit start-limit-hit and stayed down: every Android app then
# failed to launch, and a launcher tap looked like a no-op that bounced back to
# the desktop.
#
# Wait for the socket first, and only then spend the restarts.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=60

[Service]
RestartSec=2
ExecStartPre=/bin/sh -c 'for i in $(seq 1 240); do for s in "$XDG_RUNTIME_DIR"/wayland-?; do [ -S "$s" ] && exit 0; done; sleep 0.5; done; echo "droidloom: no Wayland compositor appeared" >&2; exit 1'
