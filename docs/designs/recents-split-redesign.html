<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最近任务里的分屏 — 交互草稿</title>
<style>
  :root {
    --fg: #f3f4f7;
    --fg2: rgba(243, 244, 247, 0.72);
    --fill: rgba(255, 255, 255, 0.10);
    --fill2: rgba(255, 255, 255, 0.16);
    --accent: #8b5cf6;
    --edge: rgba(255, 255, 255, 0.18);
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
    background: #14131a; color: var(--fg);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(100vw, 1400px);
    height: min(100vh, 875px);
    margin: 0 auto;
    overflow: hidden;
    background:
      radial-gradient(900px 600px at 18% 12%, #4a6b8a 0%, rgba(74,107,138,0) 62%),
      radial-gradient(800px 600px at 84% 24%, #7a5a86 0%, rgba(122,90,134,0) 60%),
      radial-gradient(900px 700px at 55% 96%, #3d5a4c 0%, rgba(61,90,76,0) 62%),
      linear-gradient(150deg, #22303c 0%, #2b2536 48%, #1d2622 100%);
    user-select: none;
    touch-action: none;
  }
  .stage::before {
    content: "";
    position: absolute; inset: -40px;
    background: inherit;
    filter: blur(26px) saturate(1.1);
    opacity: 0.55;
  }

  /* status strip ---------------------------------------------------------- */
  .status {
    position: absolute; inset: 0 0 auto 0; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; font-size: 13px; font-weight: 600; color: var(--fg2);
    z-index: 30;
  }

  /* recents --------------------------------------------------------------- */
  .recents {
    position: absolute; inset: 48px 0 0 0;
    display: flex; align-items: center; justify-content: center;
    gap: 44px;
    transition: opacity 200ms ease, transform 220ms ease;
  }
  .recents.hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }

  .card {
    position: relative;
    width: 420px; height: 300px;
    border-radius: var(--radius);
    background: #f7f6f3;
    box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
    overflow: hidden;
    transition: transform 160ms ease, opacity 160ms ease;
    cursor: grab;
  }
  .card.dimmed { opacity: 0.25; }
  .card.picked { transform: scale(0.94); }
  .card-head {
    height: 40px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: #ecebe6; color: #292825;
    font-size: 12.5px; font-weight: 650;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c9c7c1; }
  .card-head .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head-btn {
    width: 26px; height: 26px; border: 0; border-radius: 8px;
    background: transparent; color: #5f5c56; font-size: 14px;
    display: grid; place-items: center; cursor: pointer;
  }
  .head-btn:hover { background: rgba(0, 0, 0, 0.07); }
  .card-body { position: absolute; inset: 40px 0 0 0; }

  .body-music {
    background: linear-gradient(160deg, #2a2f52, #4b3a63 55%, #221f33);
    color: #eef0ff; display: flex; align-items: center; gap: 20px; padding: 26px;
  }
  .body-music .cover {
    width: 118px; height: 118px; border-radius: 14px;
    background: linear-gradient(150deg, #7c6bd8, #3f3a72);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.35);
  }
  .body-music h3 { margin: 0 0 6px; font-size: 21px; font-weight: 650; }
  .body-music p { margin: 0; font-size: 12.5px; opacity: 0.62; }
  .body-music .bars { margin-top: 16px; display: flex; gap: 4px; align-items: flex-end; height: 26px; }
  .body-music .bars i {
    width: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.45);
    animation: bounce 900ms ease-in-out infinite alternate;
  }
  @keyframes bounce { from { height: 6px; } to { height: 24px; } }

  .body-doc {
    background: #ffffff; color: #2a2926; padding: 22px 24px;
    font-size: 13px; line-height: 1.7;
  }
  .body-doc .page-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .body-doc .line { height: 8px; border-radius: 4px; background: #ecebe6; margin: 9px 0; }
  .body-doc .line.short { width: 62%; }

  .body-settings {
    background: #f2f1ee; color: #2a2926; padding: 20px 22px;
  }
  .body-settings .row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; margin-bottom: 8px;
    background: #fff; border-radius: 12px; border: 1px solid #e6e4df;
    font-size: 12.5px;
  }
  .body-settings .row .glyph {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(140deg, #cbbcf5, #8b5cf6);
  }

  /* ghost ----------------------------------------------------------------- */
  .ghost {
    position: fixed; z-index: 60; pointer-events: none;
    width: 420px; height: 300px; border-radius: var(--radius);
    overflow: hidden; opacity: 0; transform: translate(-50%, -50%) scale(1);
    transition: opacity 100ms ease;
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .ghost.on { opacity: 1; }
  .ghost .mini {
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #2a2f52, #4b3a63);
  }

  /* drop zones ------------------------------------------------------------ */
  .zones {
    position: absolute; inset: 48px 0 0 0; z-index: 20;
    display: flex; opacity: 0; pointer-events: none;
    transition: opacity 140ms ease;
  }
  .zones.on { opacity: 1; }
  .zone {
    flex: 1;
    margin: 14px;
    border-radius: 18px;
    border: 1.5px dashed rgba(139, 92, 246, 0.45);
    background: rgba(139, 92, 246, 0.08);
    display: grid; place-items: center;
    color: rgba(243, 244, 247, 0.55);
    font-size: 14px; font-weight: 600;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .zone.active {
    border-color: var(--accent);
    background: rgba(139, 92, 246, 0.20);
    color: var(--fg);
    box-shadow: inset 0 0 0 1px rgba(139, 92, 246, 0.5);
  }
  .zone .hint-icon { font-size: 26px; display: block; margin-bottom: 6px; }

  /* picker ---------------------------------------------------------------- */
  .picker {
    position: absolute; inset: 48px 0 0 0; z-index: 25;
    display: flex; opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  .picker.on { opacity: 1; pointer-events: auto; }
  .picker .fixed { flex: 0 0 50%; padding: 14px; }
  .picker .fixed .pane { height: 100%; border-radius: 18px; overflow: hidden; }
  .picker .side {
    flex: 1; padding: 14px 14px 14px 0;
    display: flex;
  }
  .picker .panel {
    flex: 1; border-radius: 18px;
    background: rgba(18, 18, 26, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    padding: 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-title { font-size: 14.5px; font-weight: 650; margin-bottom: 12px; }
  .search {
    height: 34px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06); color: var(--fg);
    padding: 0 12px; font: inherit; font-size: 12.5px; margin-bottom: 12px;
  }
  .search::placeholder { color: rgba(243, 244, 247, 0.4); }
  .tile-grid {
    flex: 1; overflow: auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    align-content: start;
  }
  .tile {
    border-radius: 14px; overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .tile:hover { transform: translateY(-2px); border-color: rgba(139, 92, 246, 0.6); }
  .tile .thumb { height: 72px; }
  .tile .name { padding: 7px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.all .thumb { display: grid; place-items: center; background: rgba(139, 92, 246, 0.18); font-size: 22px; }

  /* split ----------------------------------------------------------------- */
  .split {
    position: absolute; inset: 48px 0 0 0; z-index: 26;
    display: flex; opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .split.on { opacity: 1; pointer-events: auto; }
  .pane {
    position: relative; height: 100%;
    margin: 12px; border-radius: 18px; overflow: hidden;
  }
  .pane.left { flex: 0 0 var(--ratio); margin-right: 4px; }
  .pane.right { flex: 1; margin-left: 4px; }
  .pane-cover {
    position: absolute; left: 34px; top: 34px;
    width: 150px; height: 150px; border-radius: 16px;
    background: linear-gradient(150deg, #9d8bf0, #4b3f92);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
  }
  .pane-doc { padding: 34px 36px; color: #2a2926; }
  .pane-doc b { display: block; font-size: 17px; margin-bottom: 18px; }
  .pane-doc i {
    display: block; height: 10px; border-radius: 5px;
    background: #ecebe6; margin: 12px 0;
  }
  .pane-doc i.short { width: 58%; }
  .pane .pane-label {
    position: absolute; left: 12px; bottom: 12px;
    padding: 5px 10px; border-radius: 8px;
    background: rgba(10, 10, 14, 0.55); border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 11.5px; font-weight: 600; color: var(--fg);
    backdrop-filter: blur(10px);
  }
  .handle {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 26px; height: 74px; border-radius: 13px;
    background: rgba(22, 22, 30, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
    display: grid; place-items: center;
    cursor: ew-resize; z-index: 40;
    transition: background 120ms ease;
  }
  .handle:hover, .handle.dragging { background: rgba(139, 92, 246, 0.55); }
  .handle .grip { width: 6px; height: 34px; border-radius: 3px; background: rgba(255, 255, 255, 0.55); }
  .ratio-bubble {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    padding: 4px 9px; border-radius: 8px;
    background: rgba(22, 22, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 11.5px; font-weight: 650; color: var(--fg);
    opacity: 0; transition: opacity 120ms ease;
  }
  .ratio-bubble.on { opacity: 1; }

  .split-bar {
    position: absolute; top: 6px; left: 0; right: 0; z-index: 45;
    display: flex; justify-content: center; gap: 10px;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(22, 22, 30, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--fg); font-size: 12px; font-weight: 600;
    backdrop-filter: blur(14px);
    cursor: pointer;
  }
  .pill:hover { background: rgba(139, 92, 246, 0.5); }

  /* notes ----------------------------------------------------------------- */
  .notes {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 16px; z-index: 70;
    width: 300px; padding: 14px 16px; border-radius: 16px;
    background: rgba(18, 18, 26, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px) saturate(1.3);
    font-size: 12px; line-height: 1.65; color: var(--fg2);
  }
  .notes h1 { margin: 0 0 6px; font-size: 13.5px; color: var(--fg); }
  .notes b { color: var(--fg); }
  .notes ul { margin: 6px 0 0; padding-left: 15px; }
  .notes li { margin: 3px 0; }
  .notes .state {
    margin-top: 9px; padding-top: 8px; border-top: 1px dashed rgba(255, 255, 255, 0.16);
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: rgba(243, 244, 247, 0.5);
  }
  .notes button {
    margin-top: 9px; border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06); color: var(--fg);
    font: inherit; font-weight: 600; padding: 5px 11px; border-radius: 9px; cursor: pointer;
  }
  .notes button:hover { background: rgba(255, 255, 255, 0.14); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="status">
    <span>20:41</span>
    <span>Wi-Fi 小米_47A9 · 76%</span>
  </div>

  <div class="recents" id="recents">
    <div class="card" data-app="music">
      <div class="card-head">
        <span class="dot"></span><span class="title">QueMusic</span>
        <button class="head-btn" title="关闭">✕</button>
      </div>
      <div class="card-body body-music">
        <div class="cover"></div>
        <div>
          <h3>一念焚心</h3>
          <p>周深 · 正在播放</p>
          <div class="bars">
            <i style="animation-delay:0ms"></i><i style="animation-delay:120ms"></i>
            <i style="animation-delay:240ms"></i><i style="animation-delay:60ms"></i>
            <i style="animation-delay:180ms"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="card" data-app="doc">
      <div class="card-head">
        <span class="dot"></span><span class="title">新建文档</span>
        <button class="head-btn" title="关闭">✕</button>
      </div>
      <div class="card-body body-doc">
        <div class="page-title">分屏设计草稿</div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line short"></div>
        <div class="line"></div>
        <div class="line short"></div>
      </div>
    </div>

    <div class="card" data-app="settings">
      <div class="card-head">
        <span class="dot"></span><span class="title">设置</span>
        <button class="head-btn" title="关闭">✕</button>
      </div>
      <div class="card-body body-settings">
        <div class="row"><span class="glyph"></span>外观</div>
        <div class="row"><span class="glyph"></span>显示</div>
        <div class="row"><span class="glyph"></span>声音</div>
      </div>
    </div>
  </div>

  <div class="zones" id="zones">
    <div class="zone" data-side="left"><span><span class="hint-icon">◫</span>放到左侧分屏</span></div>
    <div class="zone" data-side="right"><span><span class="hint-icon">◫</span>放到右侧分屏</span></div>
  </div>

  <div class="picker" id="picker">
    <div class="fixed"><div class="pane" id="pickerFixed"></div></div>
    <div class="side">
      <div class="panel">
        <div class="panel-title" id="pickerTitle">选择右侧应用</div>
        <input class="search" id="search" placeholder="搜索应用">
        <div class="tile-grid" id="tiles"></div>
      </div>
    </div>
  </div>

  <div class="split" id="split">
    <div class="pane left" id="splitLeft"></div>
    <div class="pane right" id="splitRight"></div>
    <div class="handle" id="handle"><div class="grip"></div></div>
    <div class="ratio-bubble" id="ratioBubble">50 : 50</div>
  </div>

  <div class="split-bar" id="splitBar" style="display:none">
    <div class="pill" id="swap">交换左右</div>
    <div class="pill" id="exitSplit">退出分屏</div>
  </div>

  <div class="notes">
    <h1>分屏 · 交互草稿</h1>
    <ul>
      <li><b>长按卡片 0.4 秒</b>拾起，两侧出现“放到左侧/右侧分屏”的落点</li>
      <li>松手后另一侧变成选择器：搜索、最近应用、全部应用</li>
      <li>分屏后拖动中间把手改比例，<b>双击复位 50:50</b></li>
      <li>顶部提供「交换左右」「退出分屏」</li>
    </ul>
    <div class="state" id="stateLine">state: recents</div>
    <button id="reset">回到最近任务</button>
  </div>
</div>

<div class="ghost" id="ghost"><div class="mini" id="ghostMini"></div></div>

<script>
(() => {
  const LONG_PRESS = 400;
  const SLOP = 8;
  const apps = {
    music: { name: 'QueMusic', cls: 'body-music' },
    doc: { name: '新建文档', cls: 'body-doc' },
    settings: { name: '设置', cls: 'body-settings' },
    browser: { name: 'Firefox', cls: 'body-music' },
    files: { name: '文件', cls: 'body-settings' },
  };
  const recents = ['music', 'doc', 'settings'];

  const stage = document.getElementById('stage');
  const recentsEl = document.getElementById('recents');
  const zones = document.getElementById('zones');
  const picker = document.getElementById('picker');
  const split = document.getElementById('split');
  const handle = document.getElementById('handle');
  const splitBar = document.getElementById('splitBar');
  const ghost = document.getElementById('ghost');
  const stateLine = document.getElementById('stateLine');

  let mode = 'recents';
  let drag = null;      // { app, startX, startY, ghostX, ghostY }
  let selected = null;  // app picked for the second pane
  let side = null;      // 'left' | 'right' of the dropped card
  let ratio = 0.5;

  function setState(label) {
    mode = label;
    stateLine.textContent = 'state: ' + label;
  }

  function cardEl(app) {
    return recentsEl.querySelector(`.card[data-app="${app}"]`);
  }

  /* ---- long-press drag ------------------------------------------------ */
  recentsEl.addEventListener('pointerdown', (event) => {
    if (mode !== 'recents') return;
    const card = event.target.closest('.card');
    if (!card || event.target.closest('.head-btn')) return;
    const app = card.dataset.app;
    const startX = event.clientX;
    const startY = event.clientY;
    let timer = setTimeout(() => beginDrag(card, app, startX, startY), LONG_PRESS);
    let moved = false;

    function onMove(move) {
      if (!drag) {
        if (Math.hypot(move.clientX - startX, move.clientY - startY) > SLOP) {
          clearTimeout(timer);
          cleanup();
        }
        return;
      }
      const x = move.clientX;
      const y = move.clientY;
      ghost.style.left = x + 'px';
      ghost.style.top = y + 'px';
      const zone = zoneAt(x);
      document.querySelectorAll('.zone').forEach((z) => {
        z.classList.toggle('active', z.dataset.side === zone);
      });
      drag.zone = zone;
    }

    function onUp(up) {
      clearTimeout(timer);
      if (!drag) { cleanup(); return; }
      const zone = zoneAt(up.clientX);
      endDrag(zone);
      cleanup();
    }

    function cleanup() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    }

    function beginDrag(card, app, x, y) {
      drag = { app, zone: null };
      card.classList.add('picked');
      recentsEl.querySelectorAll('.card').forEach((c) => {
        if (c !== card) c.classList.add('dimmed');
      });
      ghost.classList.add('on');
      ghostMini.className = 'mini ' + (apps[app]?.cls ?? '');
      ghost.style.left = x + 'px';
      ghost.style.top = y + 'px';
      zones.classList.add('on');
      setState('dragging');
      if (navigator.vibrate) navigator.vibrate(8);
    }

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });

  function zoneAt(x) {
    const rect = stage.getBoundingClientRect();
    const share = (x - rect.left) / rect.width;
    if (share < 0.35) return 'left';
    if (share > 0.65) return 'right';
    return null;
  }

  function endDrag(zone) {
    const app = drag?.app;
    ghost.classList.remove('on');
    zones.classList.remove('on');
    document.querySelectorAll('.zone').forEach((z) => z.classList.remove('active'));
    recentsEl.querySelectorAll('.card').forEach((c) => c.classList.remove('picked', 'dimmed'));
    drag = null;
    if (!app || !zone) { setState('recents'); return; }
    openPicker(app, zone);
  }

  /* ---- picker ---------------------------------------------------------- */
  function openPicker(app, chosenSide) {
    side = chosenSide;
    recentsEl.classList.add('hidden');
    picker.classList.add('on');
    document.getElementById('pickerTitle').textContent =
      chosenSide === 'left' ? '选择左侧应用' : '选择右侧应用';
    const fixedPane = document.getElementById('pickerFixed');
    fixedPane.className = 'pane ' + (apps[app]?.cls ?? '');
    paintPaneEl(fixedPane, app);
    renderTiles(app);
    setState('picker');
  }

  function renderTiles(fixedApp) {
    const grid = document.getElementById('tiles');
    grid.innerHTML = '';
    const order = ['music', 'doc', 'settings', 'browser', 'files']
      .filter((a) => a !== fixedApp);
    for (const id of order) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML =
        `<div class="thumb ${apps[id].cls}"></div><div class="name">${apps[id].name}</div>`;
      tile.onclick = () => enterSplit(fixedApp, id);
      grid.appendChild(tile);
    }
    const all = document.createElement('div');
    all.className = 'tile all';
    all.innerHTML = '<div class="thumb">⋯</div><div class="name">全部应用</div>';
    all.onclick = () => enterSplit(fixedApp, 'settings');
    grid.appendChild(all);
  }

  document.getElementById('search').addEventListener('input', (event) => {
    const q = event.target.value.trim().toLowerCase();
    document.querySelectorAll('#tiles .tile').forEach((tile) => {
      const name = tile.querySelector('.name').textContent.toLowerCase();
      tile.style.display = !q || name.includes(q) ? '' : 'none';
    });
  });

  /* ---- split ----------------------------------------------------------- */
  function enterSplit(fixedApp, secondApp) {
    selected = secondApp;
    picker.classList.remove('on');
    const first = side === 'left' ? fixedApp : secondApp;
    const other = side === 'left' ? secondApp : fixedApp;
    paintPane('splitLeft', first);
    paintPane('splitRight', other);
    applyRatio(0.5);
    split.classList.add('on');
    splitBar.style.display = 'flex';
    setState('split');
  }

  function paintPaneEl(el, app) {
    el.dataset.app = app;
    const label = `<span class="pane-label">${apps[app].name}</span>`;
    if (app === 'music') {
      el.innerHTML = `<div class="pane-cover"></div>${label}`;
    } else if (app === 'doc') {
      el.innerHTML =
        `<div class="pane-doc"><b>分屏设计草稿</b>` +
        `<i></i><i></i><i class="short"></i><i></i></div>${label}`;
    } else {
      el.innerHTML = label;
    }
  }

  function paintPane(id, app) {
    const el = document.getElementById(id);
    el.className =
      'pane ' + (id === 'splitLeft' ? 'left' : 'right') + ' ' + (apps[app]?.cls ?? '');
    paintPaneEl(el, app);
  }

  function applyRatio(value) {
    ratio = Math.min(0.7, Math.max(0.3, value));
    split.style.setProperty('--ratio', (ratio * 100).toFixed(2) + '%');
    document.getElementById('ratioBubble').textContent =
      `${Math.round(ratio * 100)} : ${Math.round((1 - ratio) * 100)}`;
    const bubble = document.getElementById('ratioBubble');
    bubble.style.left = (ratio * 100).toFixed(2) + '%';
    bubble.classList.add('on');
  }

  let draggingHandle = false;
  handle.addEventListener('pointerdown', (event) => {
    if (mode !== 'split') return;
    draggingHandle = true;
    handle.classList.add('dragging');
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', (event) => {
    if (!draggingHandle) return;
    const rect = stage.getBoundingClientRect();
    applyRatio((event.clientX - rect.left) / rect.width);
  });
  handle.addEventListener('pointerup', () => {
    draggingHandle = false;
    handle.classList.remove('dragging');
    document.getElementById('ratioBubble').classList.remove('on');
  });
  handle.addEventListener('dblclick', () => applyRatio(0.5));

  document.getElementById('swap').onclick = () => {
    const leftPane = document.getElementById('splitLeft');
    const rightPane = document.getElementById('splitRight');
    const leftApp = leftPane.dataset.app;
    const rightApp = rightPane.dataset.app;
    paintPane('splitLeft', rightApp);
    paintPane('splitRight', leftApp);
  };

  document.getElementById('exitSplit').onclick = reset;
  document.getElementById('reset').onclick = reset;

  function reset() {
    split.classList.remove('on');
    splitBar.style.display = 'none';
    picker.classList.remove('on');
    recentsEl.classList.remove('hidden');
    document.querySelectorAll('.card').forEach((c) => c.classList.remove('picked', 'dimmed'));
    setState('recents');
  }

  setState('recents');

  // Demo deep links so the three stages can be screenshotted without
  // dragging: ?state=picker / ?state=split
  const params = new URLSearchParams(location.search);
  if (params.get('notes') === '0') {
    document.querySelector('.notes').style.display = 'none';
  }
  const demo = params.get('state');
  if (demo === 'picker') {
    openPicker('music', 'left');
  } else if (demo === 'split') {
    openPicker('music', 'left');
    enterSplit('music', 'doc');
  } else if (demo === 'zones') {
    zones.classList.add('on');
    recentsEl.querySelectorAll('.card').forEach((c, index) => {
      if (index === 0) c.classList.add('picked');
      else c.classList.add('dimmed');
    });
    setState('dragging');
  }
})();
</script>
</body>
</html>
